<!DOCTYPE html>
<html lang="en" data-theme="c">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangeul Institute Dublin – demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--night:#1A1033;--night2:#2A1A55;--pink:#FF3EA5;--pink-d:#C81E7B;--lav:#8B5CFF;--lav-d:#5B32CC;--sky:#5CCBFF;--lime:#D4FF3A;--ink:#1A1033;--muted:#6E6290;--line:#EADFFF;--mint:#12B58A;--mint-bg:#DCF8EF;
--holo:linear-gradient(135deg,#FF3EA5 0%,#B57BFF 35%,#5CCBFF 65%,#FF9AD5 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;color:var(--ink);font-size:17px;line-height:1.45;font-weight:500;min-height:100vh;
 background:radial-gradient(circle at 15% 10%,#FFD6EE 0,transparent 40%),radial-gradient(circle at 90% 30%,#D9E8FF 0,transparent 45%),radial-gradient(circle at 30% 85%,#EADBFF 0,transparent 50%),#F6F1FF;background-attachment:fixed;
 padding-bottom:calc(108px + env(safe-area-inset-bottom))}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.sample{background:var(--lime);color:var(--night);text-align:center;font-weight:700;font-size:12px;padding:6px 12px}
header{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:16px 16px 24px;color:#fff;border-radius:0 0 30px 30px;
 background:radial-gradient(circle at 85% -20%,rgba(255,62,165,.55),transparent 55%),radial-gradient(circle at 0% 120%,rgba(92,203,255,.45),transparent 55%),var(--night)}
header::after{content:"✦  ✧        ✦";position:absolute;right:18px;bottom:4px;font-size:14px;letter-spacing:2px;color:#FFD6EE;opacity:.8;pointer-events:none}
.logo{display:block;width:60px;height:60px;padding:3px;border:none;border-radius:50%;cursor:pointer;flex:none;background:conic-gradient(from 0deg,#FF3EA5,#B57BFF,#5CCBFF,#D4FF3A,#FF3EA5);box-shadow:0 0 18px rgba(255,62,165,.55)}
.logo img{width:100%;height:100%;display:block;border-radius:50%;background:#fff}
.logo:active{transform:scale(.93)}
header .t{flex:1;min-width:0}
header h1{margin:0;font-family:"Unbounded",sans-serif;font-size:16px;font-weight:700;line-height:1.2}
header p{margin:3px 0 0;font-size:13px;color:#E9DDFF}
header button{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:999px;padding:9px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}
main,.login{max-width:640px;margin:0 auto;padding:20px 16px}
.ttl{display:flex;flex-direction:column;align-items:flex-start;gap:0;margin:2px 0 18px}
.ttl .ko{font-family:"Black Han Sans",sans-serif;font-size:52px;line-height:1.1;background:linear-gradient(100deg,#FF3EA5 10%,#A35CFF 55%,#4FB8FF 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl .en{font-family:"Unbounded",sans-serif;font-size:17px;font-weight:600;color:var(--night);margin-top:2px}
.ttl .en::before{content:"✦ ";color:var(--pink)}
h3{font-family:"Unbounded",sans-serif;font-size:15px;font-weight:700;margin:0 0 8px}
.card{border:2px solid transparent;border-radius:24px;padding:16px;margin-bottom:16px;background:linear-gradient(#fff,#fff) padding-box,var(--holo) border-box;box-shadow:0 10px 28px rgba(139,92,255,.16)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}.small{font-size:14px}
.big{font-family:"Unbounded",sans-serif;font-size:30px;font-weight:800;line-height:1.1}
.btn{display:block;width:100%;border:none;border-radius:999px;min-height:56px;padding:12px 18px;font:inherit;font-family:"Unbounded",sans-serif;font-weight:700;font-size:16px;cursor:pointer;text-align:center;text-decoration:none;margin-top:14px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:none!important}
.btn-main{color:#fff;background:linear-gradient(120deg,var(--pink),var(--lav));box-shadow:0 5px 0 var(--lav-d),0 10px 22px rgba(255,62,165,.35)}
.btn-red{color:#fff;background:var(--pink);box-shadow:0 5px 0 var(--pink-d)}
.btn-ghost{color:var(--lav-d);background:linear-gradient(#fff,#fff) padding-box,var(--holo) border-box;border:2px solid transparent;box-shadow:0 5px 0 var(--line)}
.btn-sm{display:inline-block;width:auto;min-height:44px;padding:6px 12px;font-family:"Noto Sans KR",sans-serif;font-size:15px;font-weight:700;margin:0}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:2px solid var(--night);background:#fff;border-radius:999px;padding:8px 15px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--night)}
.chip.on{background:var(--night);color:#fff;box-shadow:0 0 0 3px #FFD6EE,0 0 16px rgba(255,62,165,.5)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.b-paid{background:var(--mint-bg);color:#0B7F60}
.b-due{background:#FFF3C4;color:#7A5A00}
.b-late{background:var(--pink);color:#fff}
.b-on{background:#DDF3FF;color:#0D6B99}
.b-off{background:#F0EAFF;color:var(--lav-d)}
.b-break{background:#ECECF3;color:#4A4560}
.b-game{background:var(--lime);color:var(--night)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.grid2 .card{margin:0}
.tile .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.tile.red .big{background:linear-gradient(120deg,var(--pink),#FF7A59);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile.green .big{color:var(--mint)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1.5px solid var(--line)}
.list li:first-child{border-top:none}
.past{opacity:.45}
.att{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:10px;text-align:left;color:var(--ink)}
.att .box{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.att.on{border-color:var(--pink);background:#FFF0F8;box-shadow:0 0 14px rgba(255,62,165,.25)}
.att.on .box{background:linear-gradient(135deg,var(--pink),var(--lav));border-color:transparent}
textarea{width:100%;min-height:130px;font:inherit;font-size:16px;padding:12px;border:2px solid var(--line);border-radius:18px;resize:vertical;background:#FFFBFE}
.weeknav{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.weeknav button{width:58px;height:58px;border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer;flex:none;background:linear-gradient(135deg,var(--pink),var(--lav));box-shadow:0 5px 0 var(--lav-d)}
.weeknav button:active{transform:translateY(3px);box-shadow:none}
.weeknav button:disabled{opacity:.3}
.weeknav .mid{flex:1;text-align:center}
.weeknav strong{display:block;font-family:"Unbounded",sans-serif;font-size:19px;font-weight:700}
.seg{display:flex;gap:8px}.seg button{flex:1}
.bank{font-family:"Unbounded",sans-serif;font-size:15px;font-weight:600;background:#F7F2FF;border-radius:14px;padding:11px 12px;word-break:break-all;margin:4px 0 12px;letter-spacing:.02em}
.check{display:flex;gap:12px;align-items:flex-start;font-size:16px;cursor:pointer}
.check input{width:28px;height:28px;flex:none;margin-top:1px;accent-color:var(--pink)}
.rules p{margin:0 0 10px;font-size:15px}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:6px;padding:7px;z-index:10;max-width:620px;margin:0 auto;border-radius:999px;background:rgba(26,16,51,.92);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(26,16,51,.35)}
.tabs button{flex:1;min-height:60px;border:none;border-radius:999px;background:transparent;color:#BFB3E6;font:inherit;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.tabs button.on{color:#fff;background:linear-gradient(120deg,var(--pink),var(--lav));box-shadow:0 0 18px rgba(255,62,165,.7),0 0 4px #fff inset}
.tabs .ic{font-size:20px;line-height:1.15}
.tabs .tk{font-family:"Noto Sans KR",sans-serif;font-size:11px;font-weight:700;opacity:.85}
.tabs .tl{font-size:12px}
.dot{position:absolute;top:2px;right:14%;background:var(--lime);color:var(--night);border-radius:999px;font-size:11px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:800}
.who{display:flex;align-items:center;gap:12px;width:100%;border:2px solid transparent;border-radius:20px;padding:12px;font:inherit;font-size:16px;cursor:pointer;margin-bottom:10px;text-align:left;color:var(--ink);background:linear-gradient(#fff,#fff) padding-box,var(--holo) border-box}
.who .av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Unbounded",sans-serif;font-weight:800;font-size:17px;flex:none;color:#fff;background:linear-gradient(135deg,var(--pink),var(--lav),var(--sky))}
.who.teacher{color:#fff;background:linear-gradient(var(--night),var(--night)) padding-box,var(--holo) border-box;box-shadow:0 0 22px rgba(255,62,165,.35)}
.who.teacher .muted{color:#D9CCFF}
.who.teacher .av{background:var(--lime);color:var(--night)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(98px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--night);color:#fff;border-radius:999px;padding:14px 20px;z-index:20;font-size:15px;font-weight:700;text-align:center;box-shadow:0 0 18px rgba(255,62,165,.45)}
.toast[hidden]{display:none}
footer{text-align:center;font-size:12px;color:var(--muted);padding:12px 16px 4px}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div class="sample">DEMO — made-up students, sample bank details, no real login yet</div>
<div id="root"></div>
<div id="toast" class="toast" hidden></div>
<footer>Version 1.4 (23 Oct) · demo data saves in this browser only</footer>

<script>
const KEY='koreanClassDemo_v2';
const ttl=(en,ko)=>`<h2 class="ttl"><span class="ko" lang="ko">${ko}</span><span class="en">${en}</span></h2>`;
const SETTINGS={
  school:'Hangeul Institute Dublin',
  schoolKo:'한글학당',
  address:'Jervis St, North City, Dublin 1',
  iban:'IE00 SAMP 1234 5678 9012 34', // SAMPLE ONLY – real IBAN is entered later in private admin settings
  bic:'SAMPLE00',
  accountName:'Account holder name',
  reviewUrl:'https://maps.app.goo.gl/QFfjn3S1tttJFKA57',
  classDay:6                           // TODO: confirm day (6 = Saturday, placeholder)
};
const GROUPS={beg2:{name:'Beginner Lv2',time:'10:00–12:00',cap:15,price:220},imp:{name:'Improver',time:'12:00–14:00',cap:15,price:220}};
const PRICES={term:220,private1:25,pack5:125,pack10:250,trial:10,gameGuest:25,gameDeposit:10,gameOnDay:15};
const DAY=864e5;

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fd=s=>pd(s).toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'});
const fdt=t=>new Date(t).toLocaleString('en-IE',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const eur=n=>'€'+n.toLocaleString('en-IE');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>sod(new Date());

function seed(){
  const t=today();
  let start=new Date(t); start.setDate(start.getDate()-((start.getDay()-SETTINGS.classDay+7)%7)-28); // class day ~4 weeks ago
  const weeks=[]; let n=0;
  for(let i=0;i<10;i++){
    const d=new Date(start); d.setDate(d.getDate()+7*i);
    n++; weeks.push({date:ymd(d),type:n===10?'game':'class',no:n,mode:(n===3||n===7)?'online':'offline'});
  }
  const due=ymd(new Date(pd(weeks[0].date).getTime()+7*DAY));
  const soon=ymd(new Date(t.getTime()+5*DAY));
  const S=(id,name,group,extra={})=>Object.assign({id,name,group,ref:'KC-'+(1000+id),consent:false,email:name.split(' ')[0].toLowerCase()+'@example.com',payments:[],pack:null},extra);
  const pay=(desc,amount,status,dueDate)=>({id:Math.random().toString(36).slice(2,9),desc,amount,status,dueDate});
  const term=s=>pay('Group term (10 classes)',PRICES.term,s,due);
  const students=[
    S(1,'Aoife Byrne','beg2',{consent:true,payments:[term('paid')]}),
    S(2,'Daniel Murphy','beg2',{payments:[term('due')]}),
    S(3,'Sofia Rossi','beg2',{consent:true,payments:[term('paid')]}),
    S(4,"Liam O'Connor",'beg2',{payments:[term('paid'),pay('Private pack – 5 lessons',PRICES.pack5,'paid',due)],pack:{size:5}}),
    S(5,'Emma Walsh','beg2',{consent:true,payments:[term('due')]}),
    S(6,'Chen Wei','beg2',{payments:[term('paid')]}),
    S(7,'Sarah Kelly','imp',{consent:true,payments:[term('paid')]}),
    S(8,'Jack Nolan','imp',{payments:[term('paid')]}),
    S(9,'María López','imp',{consent:true,payments:[term('due')]}),
    S(10,'Tom Brennan','imp',{payments:[term('paid')]}),
    S(11,'Niamh Daly',null,{consent:true,payments:[pay('Private pack – 10 lessons',PRICES.pack10,'paid',due)],pack:{size:10}}),
    S(12,'Hugo Martin',null,{trial:'beg2',payments:[pay('Trial class',PRICES.trial,'due',soon)]})
  ];
  const at=(days,h)=>{const d=new Date(t);d.setDate(d.getDate()+days);d.setHours(h,0,0,0);return d.getTime()};
  const privates=[
    {id:'p1',sid:4,time:at(-10,17),status:'done'},{id:'p2',sid:4,time:at(-3,17),status:'done'},{id:'p3',sid:4,time:at(4,18),status:'booked'},
    {id:'p4',sid:11,time:at(-14,16),status:'done'},{id:'p5',sid:11,time:at(-7,16),status:'done'},{id:'p6',sid:11,time:at(-1,16),status:'done'},{id:'p7',sid:11,time:at(0,23),status:'booked'},{id:'p8',sid:11,time:at(6,16),status:'booked'}
  ];
  const attendance={}, plans={};
  weeks.forEach((w,i)=>{
    if(w.type==='break'||pd(w.date)>t) return;
    ['beg2','imp'].forEach(g=>{
      const k=g+'_'+i; attendance[k]={};
      students.filter(s=>s.group===g).forEach(s=>{if((s.id+i)%5) attendance[k][s.id]=true});
      plans[k]=w.no===1?'Intro + review of Hangul. Self-introductions (저는 … 입니다).':w.no===2?'Numbers (Sino-Korean), prices, shopping role-play.':'';
    });
  });
  const gd=weeks[9].date;
  const guests=[
    {id:'g1',name:'Ciara (friend of Aoife)',ref:'GD-01',deposit:'paid',onDay:'due',gameDate:gd},
    {id:'g2',name:'Mark Tierney',ref:'GD-02',deposit:'due',onDay:'due',gameDate:gd},
    {id:'g3',name:'Yuna Park',ref:'GD-03',deposit:'paid',onDay:'due',gameDate:gd}
  ];
  return {weeks,students,privates,attendance,plans,guests,breakWeeks:2};
}

function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
let db=load(); if(!db||!db.weeks) {db=seed(); save()}
let ui={who:null,tab:null,group:'beg2',week:null,filter:'all'};
try{const u=JSON.parse(sessionStorage.getItem(KEY+'_ui'));if(u)ui=Object.assign(ui,u)}catch(e){}
if(/[?&]home=1/.test(location.search)){ui.who=null;ui.tab=null;ui.week=null;try{sessionStorage.removeItem(KEY+'_ui');history.replaceState(null,'',location.pathname)}catch(e){}}
const saveUI=()=>{try{sessionStorage.setItem(KEY+'_ui',JSON.stringify(ui))}catch(e){}};

const stu=id=>db.students.find(s=>s.id===id);
const isLate=p=>p.status==='due'&&pd(p.dueDate)<today();
const payBadge=p=>p.status==='paid'?'<span class="badge b-paid">Paid</span>':isLate(p)?'<span class="badge b-late">Overdue</span>':'<span class="badge b-due">Due '+fd(p.dueDate)+'</span>';
const owes=s=>s.payments.some(p=>p.status==='due');
const weekBadge=w=>w.type==='break'?'<span class="badge b-break">Break</span>':w.type==='game'?'<span class="badge b-game">🎲 Game Day</span>':w.mode==='online'?'<span class="badge b-on">Online</span>':'<span class="badge b-off">In person</span>';
const weekLabel=w=>w.type==='break'?'Break week':w.type==='game'?'Class '+w.no+' · Korean Game Day':'Class '+w.no;
const currentWeekIdx=()=>{const t=today();let i=db.weeks.findIndex(w=>w.type!=='break'&&pd(w.date)>=t);return i<0?db.weeks.length-1:i};
const groupCount=g=>db.students.filter(s=>s.group===g).length;
const termEnd=()=>db.weeks[db.weeks.length-1].date;
const addWeeks=(ds,n)=>{const d=pd(ds);d.setDate(d.getDate()+7*n);return ymd(d)};
const breakStart=()=>addWeeks(termEnd(),1);
const nextTerm=()=>addWeeks(termEnd(),db.breakWeeks+1);
function normalize(){
  while(db.weeks.length&&db.weeks[db.weeks.length-1].type==='break') db.weeks.pop();
  let n=db.weeks.filter(w=>w.type!=='break').length;
  while(n<10){db.weeks.push({date:addWeeks(termEnd(),1),type:'class',mode:'offline'});n++}
  while(n>10){const i=db.weeks.map(w=>w.type!=='break').lastIndexOf(true);db.weeks.splice(i,1);n--}
  n=0; db.weeks.forEach(w=>{if(w.type!=='break'){n++;w.no=n;w.type=n===10?'game':'class';if(!w.mode)w.mode='offline'}else delete w.no});
  db.guests.forEach(g=>g.gameDate=termEnd());
  if(ui.week>=db.weeks.length) ui.week=db.weeks.length-1;
}
function guestPayments(){
  return db.guests.flatMap(g=>[
    {id:g.id+'_dep',gid:g.id,part:'deposit',desc:'Game Day deposit (upfront)',amount:PRICES.gameDeposit,status:g.deposit,dueDate:g.gameDate,s:g},
    {id:g.id+'_day',gid:g.id,part:'onDay',desc:'Game Day: pay in person',amount:PRICES.gameOnDay,status:g.onDay,dueDate:g.gameDate,s:g}]);
}
function packInfo(s){
  if(!s.pack) return null;
  const mine=db.privates.filter(p=>p.sid===s.id);
  const done=mine.filter(p=>p.status==='done').length, booked=mine.filter(p=>p.status!=='done').length;
  return {size:s.pack.size,done,booked,left:s.pack.size-done-booked};
}

let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2500)}

/* ---------- STUDENT ---------- */
function vStudentHome(s){
  const t=today(); let h=ttl('Hi, '+esc(s.name.split(' ')[0])+'!','안녕하세요');
  if(s.group||s.trial){
    const g=GROUPS[s.group||s.trial];
    const left=db.weeks.filter(w=>w.type!=='break'&&pd(w.date)>=t).length;
    const next=db.weeks.find(w=>w.type!=='break'&&pd(w.date)>=t);
    const brk=db.weeks.find(w=>w.type==='break'&&pd(w.date)>=t)||{date:breakStart()};
    const brkLen=db.weeks.some(w=>w.type==='break'&&pd(w.date)>=t)?'1 week':db.breakWeeks+(db.breakWeeks===1?' week':' weeks');
    h+=`<div class="card"><div class="row"><h3>${g.name}${s.trial?' (trial)':''}</h3><span class="muted small">${g.time}</span></div>
      ${next?`<p style="margin:6px 0 2px" class="muted small">Next class</p><div class="row"><b style="font-size:20px">${fd(next.date)}</b>${weekBadge(next)}</div>
      <p class="small muted" style="margin:6px 0 0">${next.mode==='online'?'Online: link sent before class':'📍 '+esc(SETTINGS.address)}</p>`:'<p>No more classes this term.</p>'}</div>`;
    if(!s.trial) h+=`<div class="grid2"><div class="card tile"><div class="lbl">Classes left</div><div class="big">${left}</div><div class="small muted">of 10 this term</div></div>
      <div class="card tile"><div class="lbl">Next break</div><div class="big" style="font-size:20px;margin-top:6px">${fd(brk.date)}</div><div class="small muted">${brkLen}</div></div></div>`;
    if(!s.trial) h+=`<div class="card"><h3>Term schedule</h3><ul class="list">${db.weeks.map(w=>`<li class="${pd(w.date)<t?'past':''}"><span>${fd(w.date)}<br><span class="small muted">${weekLabel(w)}</span></span>${weekBadge(w)}</li>`).join('')}
      <li><span>${fd(breakStart())}<br><span class="small muted">Break: ${db.breakWeeks} ${db.breakWeeks===1?'week':'weeks'}</span></span><span class="badge b-break">Break</span></li>
      <li><span>${fd(nextTerm())}<br><span class="small muted">Next term starts</span></span><span class="badge b-on">New term</span></li></ul></div>`;
  }
  const pi=packInfo(s);
  if(pi){
    const mine=db.privates.filter(p=>p.sid===s.id&&p.status!=='done').sort((a,b)=>a.time-b.time);
    h+=`<div class="card"><div class="row"><h3>Private lessons</h3><span class="badge b-on">${pi.left} left to book</span></div>
      <p class="small muted" style="margin:0 0 6px">Pack of ${pi.size}: ${pi.done} done, ${pi.booked} booked</p>
      <ul class="list">${mine.map(p=>{const within=p.time-Date.now()<DAY;return `<li><span>${fdt(p.time)}${p.status==='resched'?'<br><span class="badge b-due">Reschedule requested</span>':''}</span>${p.status==='booked'?(within?'<span class="small muted" style="text-align:right">Within 24h:<br>counts as done</span>':`<button class="btn btn-ghost btn-sm" data-act="resched" data-id="${p.id}">Reschedule</button>`):''}</li>`}).join('')||'<li class="muted">No lessons booked yet</li>'}</ul>
      <p class="small muted" style="margin:8px 0 0">Weekdays & weekends after 4pm. Free 10-minute level test before your first private lesson. Rescheduling needs 24 hours' notice.</p></div>`;
  }
  return h;
}

/* ---------- TEACHER ---------- */
function vTeacherClasses(){
  if(ui.week==null) ui.week=currentWeekIdx();
  const i=ui.week, w=db.weeks[i];
  let h=ttl('Classes','수업')+`<div class="chips">${Object.entries(GROUPS).map(([k,g])=>`<button class="chip ${ui.group===k?'on':''}" data-act="group" data-g="${k}">${g.name} (${groupCount(k)}/${g.cap})</button>`).join('')}<button class="chip ${ui.group==='private'?'on':''}" data-act="group" data-g="private">Private</button></div>`;
  if(ui.group==='private'){
    const list=db.privates.filter(p=>p.status!=='done').sort((a,b)=>a.time-b.time);
    return h+`<div class="card"><h3>Upcoming private lessons</h3><ul class="list">${list.map(p=>`<li><span><b>${esc(stu(p.sid).name)}</b><br><span class="small muted">${fdt(p.time)}</span>${p.status==='resched'?'<br><span class="badge b-due">Asked to reschedule</span>':''}</span><button class="btn btn-ghost btn-sm" data-act="pdone" data-id="${p.id}">Mark done</button></li>`).join('')||'<li class="muted">None booked</li>'}</ul></div>
      <div class="card"><h3>Packs</h3><ul class="list">${db.students.filter(s=>s.pack).map(s=>{const pi=packInfo(s);return `<li><span>${esc(s.name)}</span><span class="small">${pi.done}/${pi.size} done · ${pi.booked} booked · <b>${pi.left} left</b></span></li>`}).join('')}</ul></div>`;
  }
  const g=GROUPS[ui.group], k=ui.group+'_'+i;
  h+=`<div class="weeknav"><button data-act="week" data-d="-1" ${i<=0?'disabled':''} aria-label="Previous week">◀</button><div class="mid"><strong>${fd(w.date)}</strong><span class="small muted">${weekLabel(w)} · ${g.time}</span></div><button data-act="week" data-d="1" ${i>=db.weeks.length-1?'disabled':''} aria-label="Next week">▶</button></div>`;
  h+=`<div class="card"><div class="seg">
      <button class="btn btn-sm ${w.type!=='break'&&w.mode==='offline'?'btn-main':'btn-ghost'}" data-act="mode" data-m="offline">In person</button>
      <button class="btn btn-sm ${w.type!=='break'&&w.mode==='online'?'btn-main':'btn-ghost'}" data-act="mode" data-m="online">Online</button>
      <button class="btn btn-sm ${w.type==='break'?'btn-main':'btn-ghost'}" data-act="mode" data-m="break">Break</button></div>
      <p class="small muted" style="margin:8px 0 0">Applies to both groups on this date. Students see it straight away.</p></div>`;
  if(w.type==='break') return h+`<div class="card"><p style="margin:0">Break week (e.g. bank holiday): no class. The term moves one week later so it still has 10 classes.</p></div>`;
  if(w.type==='game') h+=`<div class="card"><div class="row"><h3>🎲 Game Day guests</h3><b>${db.guests.length}</b></div>
    <p class="small muted" style="margin:0 0 6px">Non-students: €10 upfront to confirm + €15 in person. Private students can join too.</p>
    <ul class="list">${db.guests.map(g=>`<li><span><b>${esc(g.name)}</b> · ${esc(g.ref)}<br>
      <span class="small">Deposit €10: ${g.deposit==='paid'?'✅':'⏳'} · On the day €15: ${g.onDay==='paid'?'✅':'⏳'}</span></span>
      <span style="display:flex;flex-direction:column;gap:6px"><button class="btn btn-sm ${g.deposit==='paid'?'btn-ghost':'btn-main'}" data-act="gpay" data-g="${g.id}" data-part="deposit">${g.deposit==='paid'?'Undo €10':'€10 paid'}</button>
      <button class="btn btn-sm ${g.onDay==='paid'?'btn-ghost':'btn-main'}" data-act="gpay" data-g="${g.id}" data-part="onDay">${g.onDay==='paid'?'Undo €15':'€15 paid'}</button></span></li>`).join('')}</ul></div>
    <div class="card"><h3>Break after this term</h3><div class="seg">
      <button class="btn btn-sm ${db.breakWeeks===1?'btn-main':'btn-ghost'}" data-act="brk" data-n="1">1 week</button>
      <button class="btn btn-sm ${db.breakWeeks===2?'btn-main':'btn-ghost'}" data-act="brk" data-n="2">2 weeks</button></div>
      <p class="small muted" style="margin:8px 0 0">Next term starts ${fd(nextTerm())}.</p></div>`;
  const list=db.students.filter(s=>s.group===ui.group||s.trial===ui.group), att=db.attendance[k]||{};
  const here=list.filter(s=>att[s.id]).length;
  h+=`<div class="card"><div class="row"><h3>Attendance</h3><b>${here}/${list.length}</b></div>
    ${list.map(s=>`<button class="att ${att[s.id]?'on':''}" data-act="att" data-id="${s.id}"><span class="box">${att[s.id]?'✓':''}</span><span style="flex:1">${esc(s.name)}${s.trial?' <span class="badge b-due">Trial</span>':''}</span>${owes(s)?'<span class="badge b-late">€ owed</span>':''}</button>`).join('')}</div>
    <div class="card"><h3>Lesson plan</h3><textarea data-act="plan" placeholder="What will you teach this week?">${esc(db.plans[k]||'')}</textarea><p class="small muted" style="margin:6px 0 0">Saves automatically. Only you can see this.</p></div>`;
  return h;
}
function vTeacherStudents(){

  const list=db.students.filter(F[ui.filter]);
  return `${ttl('Students','학생')}<div class="chips">${[['all','All'],['owes','Owe money'],['beg2','Beginner Lv2'],['imp','Improver'],['private','Private']].map(([k,l])=>`<button class="chip ${ui.filter===k?'on':''}" data-act="filter" data-f="${k}">${l}</button>`).join('')}</div>
  ${list.map(s=>`<div class="card"><div class="row"><div><b style="font-size:18px">${esc(s.name)}</b><br><span class="small muted">${s.group?GROUPS[s.group].name:''}${s.pack?(s.group?' + ':'')+'Private':''}${s.trial?'Trial ('+GROUPS[s.trial].name+')':''} · Ref ${esc(s.ref)}</span></div><span title="Instagram photo consent" class="badge ${s.consent?'b-paid':'b-off'}">📸 ${s.consent?'Yes':'No'}</span></div>
    <ul class="list" style="margin-top:8px">${s.payments.map(p=>`<li><span class="small">${esc(p.desc)}<br><b>${eur(p.amount)}</b> ${payBadge(p)}</span><button class="btn btn-sm ${p.status==='paid'?'btn-ghost':'btn-main'}" data-act="paid" data-s="${s.id}" data-p="${p.id}">${p.status==='paid'?'Undo':'Mark paid'}</button></li>`).join('')}</ul></div>`).join('')||'<p class="muted">No students here.</p>'}`;
}
function vTeacherMoney(){
  const all=db.students.flatMap(s=>s.payments.map(p=>({...p,s}))).concat(guestPayments());
  const sum=f=>all.filter(f).reduce((a,p)=>a+p.amount,0);
  const paid=sum(p=>p.status==='paid'), due=sum(p=>p.status==='due'), late=all.filter(p=>isLate(p)&&!p.gid);
  const type=p=>p.desc.startsWith('Group')?'Group lessons':p.desc.startsWith('Private')?'Private lessons':p.desc.startsWith('Game')?'Game Day guests':'Trial classes';
  const by={}; all.filter(p=>p.status==='paid').forEach(p=>by[type(p)]=(by[type(p)]||0)+p.amount);
  return `${ttl('Money','수입')}
  <div class="grid2"><div class="card tile green"><div class="lbl">Received</div><div class="big">${eur(paid)}</div></div>
  <div class="card tile ${due?'red':''}"><div class="lbl">Still owed</div><div class="big">${eur(due)}</div><div class="small muted">${late.length} overdue</div></div></div>
  <div class="card"><h3>Received by type</h3><ul class="list">${Object.entries(by).map(([k,v])=>`<li><span>${k}</span><b>${eur(v)}</b></li>`).join('')}</ul></div>
  <div class="card"><h3>Who owes</h3><ul class="list">${all.filter(p=>p.status==='due').map(p=>`<li><span><b>${esc(p.s.name)}</b> · ${esc(p.s.ref)}<br><span class="small muted">${esc(p.desc)} · ${eur(p.amount)}</span></span>${payBadge(p)}</li>`).join('')||'<li class="muted">Nobody, all paid!</li>'}</ul>
  <button class="btn btn-ghost" data-act="tab" data-tab="students">Go to Students to mark payments</button></div>
  <p class="small muted">Tip: match the reference (e.g. KC-1002) on your bank statement, then tap "Mark paid".</p>`;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act;
  if(a==='login'){ui.who=el.dataset.who;ui.tab=null;ui.week=null}
  else if(a==='logout'){ui.who=null}
  else if(a==='home'){ui.who=null;ui.tab=null;ui.week=null;ui.group='beg2';ui.filter='all';window.scrollTo(0,0)}
  else if(a==='tab'){ui.tab=el.dataset.tab;window.scrollTo(0,0)}
  else if(a==='group'){ui.group=el.dataset.g}
  else if(a==='filter'){ui.filter=el.dataset.f}
  else if(a==='week'){ui.week=Math.max(0,Math.min(db.weeks.length-1,ui.week+Number(el.dataset.d)))}
  else if(a==='mode'){
    const w=db.weeks[ui.week], m=el.dataset.m;
    if(m==='break'){w.type='break'} else {if(w.type==='break')w.type='class';w.mode=m}
    normalize();
    save(); toast('Schedule updated');
  }
  else if(a==='att'){const k=ui.group+'_'+ui.week;db.attendance[k]=db.attendance[k]||{};const id=el.dataset.id;if(db.attendance[k][id])delete db.attendance[k][id];else db.attendance[k][id]=true;save()}
  else if(a==='paid'){const p=stu(Number(el.dataset.s)).payments.find(x=>x.id===el.dataset.p);p.status=p.status==='paid'?'due':'paid';save();toast(p.status==='paid'?'Marked as paid':'Marked as not paid')}
  else if(a==='gpay'){const g=db.guests.find(x=>x.id===el.dataset.g),k=el.dataset.part;g[k]=g[k]==='paid'?'due':'paid';save();toast(g[k]==='paid'?'Marked as paid':'Marked as not paid')}
  else if(a==='brk'){db.breakWeeks=Number(el.dataset.n);save();toast('Break set to '+el.dataset.n+(el.dataset.n==='1'?' week':' weeks'))}
  else if(a==='pdone'){db.privates.find(p=>p.id===el.dataset.id).status='done';save();toast('Lesson marked done')}
  else if(a==='resched'){db.privates.find(p=>p.id===el.dataset.id).status='resched';save();toast('Reschedule request sent to teacher')}
  else if(a==='reset'){if(!confirm('Reset all demo data?'))return;try{localStorage.removeItem(KEY)}catch(e){}db=seed();save();ui={who:null,tab:null,group:'beg2',week:null,filter:'all'};toast('Demo data reset')}
  else return;
  saveUI(); render();
});
document.addEventListener('change',e=>{
  if(e.target.dataset.act==='consent'){stu(Number(ui.who)).consent=e.target.checked;save();toast(e.target.checked?'Photo consent saved':'Photo consent removed')}
});
document.addEventListener('input',e=>{
  if(e.target.dataset.act==='plan'){db.plans[ui.group+'_'+ui.week]=e.target.value;save()}
});
render();
</script>
