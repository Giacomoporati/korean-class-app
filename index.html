<!DOCTYPE html>
<html lang="en" data-theme="c">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangeul Institute Dublin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--night:#1A1033;--night2:#2A1A55;--pink:#FF3EA5;--pink-d:#C81E7B;--lav:#8B5CFF;--lav-d:#5B32CC;--sky:#5CCBFF;--lime:#D4FF3A;--ink:#1A1033;--muted:#6E6290;--line:#EADFFF;--mint:#12B58A;--mint-bg:#DCF8EF;
--holo:linear-gradient(135deg,#FF3EA5 0%,#B57BFF 35%,#5CCBFF 65%,#FF9AD5 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;color:var(--ink);font-size:17px;line-height:1.45;font-weight:500;min-height:100vh;
 background:radial-gradient(circle at 15% 10%,#FFD6EE 0,transparent 40%),radial-gradient(circle at 90% 30%,#D9E8FF 0,transparent 45%),radial-gradient(circle at 30% 85%,#EADBFF 0,transparent 50%),#F6F1FF;background-attachment:fixed;
 padding-bottom:calc(108px + env(safe-area-inset-bottom))}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.sample{background:var(--lime);color:var(--night);text-align:center;font-weight:700;font-size:12px;padding:6px 12px}
header{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:16px 16px 24px;color:#fff;border-radius:0 0 30px 30px;
 background:radial-gradient(circle at 85% -20%,rgba(255,62,165,.55),transparent 55%),radial-gradient(circle at 0% 120%,rgba(92,203,255,.45),transparent 55%),var(--night)}
header::after{content:"✦  ✧        ✦";position:absolute;right:18px;bottom:4px;font-size:14px;letter-spacing:2px;color:#FFD6EE;opacity:.8;pointer-events:none}
.logo{display:block;width:60px;height:60px;padding:3px;border:none;border-radius:50%;cursor:pointer;flex:none;background:conic-gradient(from 0deg,#FF3EA5,#B57BFF,#5CCBFF,#D4FF3A,#FF3EA5);box-shadow:0 0 18px rgba(255,62,165,.55)}
.logo img{width:100%;height:100%;display:block;border-radius:50%;background:#fff}
.logo:active{transform:scale(.93)}
header .t{flex:1;min-width:0}
header h1{margin:0;font-family:"Unbounded",sans-serif;font-size:16px;font-weight:700;line-height:1.2}
header p{margin:3px 0 0;font-size:13px;color:#E9DDFF}
header button{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:999px;padding:9px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}
main,.login{max-width:640px;margin:0 auto;padding:20px 16px}
.ttl{display:flex;flex-direction:column;align-items:flex-start;gap:0;margin:2px 0 18px}
.ttl .ko{font-family:"Black Han Sans",sans-serif;font-size:52px;line-height:1.1;background:linear-gradient(100deg,#FF3EA5 10%,#A35CFF 55%,#4FB8FF 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl .en{font-family:"Unbounded",sans-serif;font-size:17px;font-weight:600;color:var(--night);margin-top:2px}
.ttl .en::before{content:"✦ ";color:var(--pink)}
h3{font-family:"Unbounded",sans-serif;font-size:15px;font-weight:700;margin:0 0 8px}
.card{border:2px solid transparent;border-radius:24px;padding:16px;margin-bottom:16px;background:linear-gradient(#fff,#fff) padding-box,var(--holo) border-box;box-shadow:0 10px 28px rgba(139,92,255,.16)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}.small{font-size:14px}
.big{font-family:"Unbounded",sans-serif;font-size:30px;font-weight:800;line-height:1.1}
.btn{display:block;width:100%;border:none;border-radius:999px;min-height:56px;padding:12px 18px;font:inherit;font-family:"Unbounded",sans-serif;font-weight:700;font-size:16px;cursor:pointer;text-align:center;text-decoration:none;margin-top:14px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:none!important}
.btn-main{color:#fff;background:linear-gradient(120deg,var(--pink),var(--lav));box-shadow:0 5px 0 var(--lav-d),0 10px 22px rgba(255,62,165,.35)}
.btn-red{color:#fff;background:var(--pink);box-shadow:0 5px 0 var(--pink-d)}
.btn-ghost{color:var(--lav-d);background:linear-gradient(#fff,#fff) padding-box,var(--holo) border-box;border:2px solid transparent;box-shadow:0 5px 0 var(--line)}
.btn-sm{display:inline-block;width:auto;min-height:44px;padding:6px 12px;font-family:"Noto Sans KR",sans-serif;font-size:15px;font-weight:700;margin:0}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:2px solid var(--night);background:#fff;border-radius:999px;padding:8px 15px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--night)}
.chip.on{background:var(--night);color:#fff;box-shadow:0 0 0 3px #FFD6EE,0 0 16px rgba(255,62,165,.5)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.b-paid{background:var(--mint-bg);color:#0B7F60}
.b-due{background:#FFF3C4;color:#7A5A00}
.b-late{background:var(--pink);color:#fff}
.b-on{background:#DDF3FF;color:#0D6B99}
.b-off{background:#F0EAFF;color:var(--lav-d)}
.b-break{background:#ECECF3;color:#4A4560}
.b-game{background:var(--lime);color:var(--night)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.grid2 .card{margin:0}
.tile .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.tile.red .big{background:linear-gradient(120deg,var(--pink),#FF7A59);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile.green .big{color:var(--mint)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1.5px solid var(--line)}
.list li:first-child{border-top:none}
.past{opacity:.45}
.att{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:10px;text-align:left;color:var(--ink)}
.att .box{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.att.on{border-color:var(--pink);background:#FFF0F8;box-shadow:0 0 14px rgba(255,62,165,.25)}
.att.on .box{background:linear-gradient(135deg,var(--pink),var(--lav));border-color:transparent}
textarea{width:100%;min-height:130px;font:inherit;font-size:16px;padding:12px;border:2px solid var(--line);border-radius:18px;resize:vertical;background:#FFFBFE}
.weeknav{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.weeknav button{width:58px;height:58px;border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer;flex:none;background:linear-gradient(135deg,var(--pink),var(--lav));box-shadow:0 5px 0 var(--lav-d)}
.weeknav button:active{transform:translateY(3px);box-shadow:none}
.weeknav button:disabled{opacity:.3}
.weeknav .mid{flex:1;text-align:center}
.weeknav strong{display:block;font-family:"Unbounded",sans-serif;font-size:19px;font-weight:700}
.seg{display:flex;gap:8px}.seg button{flex:1}
.bank{font-family:"Unbounded",sans-serif;font-size:15px;font-weight:600;background:#F7F2FF;border-radius:14px;padding:11px 12px;word-break:break-all;margin:4px 0 12px;letter-spacing:.02em}
.check{display:flex;gap:12px;align-items:flex-start;font-size:16px;cursor:pointer}
.check input{width:28px;height:28px;flex:none;margin-top:1px;accent-color:var(--pink)}
.rules p{margin:0 0 10px;font-size:15px}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:6px;padding:7px;z-index:10;max-width:620px;margin:0 auto;border-radius:999px;background:rgba(26,16,51,.92);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(26,16,51,.35)}
.tabs button{flex:1;min-height:60px;border:none;border-radius:999px;background:transparent;color:#BFB3E6;font:inherit;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.tabs button.on{color:#fff;background:linear-gradient(120deg,var(--pink),var(--lav));box-shadow:0 0 18px rgba(255,62,165,.7),0 0 4px #fff inset}
.tabs .ic{font-size:20px;line-height:1.15}
.tabs .tk{font-family:"Noto Sans KR",sans-serif;font-size:11px;font-weight:700;opacity:.85}
.tabs .tl{font-size:12px}
.dot{position:absolute;top:2px;right:14%;background:var(--lime);color:var(--night);border-radius:999px;font-size:11px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:800}
.who{display:flex;align-items:center;gap:12px;width:100%;border:2px solid transparent;border-radius:20px;padding:12px;font:inherit;font-size:16px;cursor:pointer;margin-bottom:10px;text-align:left;color:var(--ink);background:linear-gradient(#fff,#fff) padding-box,var(--holo) border-box}
.who .av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Unbounded",sans-serif;font-weight:800;font-size:17px;flex:none;color:#fff;background:linear-gradient(135deg,var(--pink),var(--lav),var(--sky))}
.who.teacher{color:#fff;background:linear-gradient(var(--night),var(--night)) padding-box,var(--holo) border-box;box-shadow:0 0 22px rgba(255,62,165,.35)}
.who.teacher .muted{color:#D9CCFF}
.who.teacher .av{background:var(--lime);color:var(--night)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(98px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--night);color:#fff;border-radius:999px;padding:14px 20px;z-index:20;font-size:15px;font-weight:700;text-align:center;box-shadow:0 0 18px rgba(255,62,165,.45)}
.toast[hidden]{display:none}
footer{text-align:center;font-size:12px;color:var(--muted);padding:12px 16px 4px}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}

.field{margin-bottom:12px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:5px}
.inp{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--lav)}
.err{background:#FFE4EF;color:#B0135F;border-radius:14px;padding:10px 14px;font-weight:700;margin:10px 0;font-size:15px}
.ok{background:var(--mint-bg);color:#0B7F60;border-radius:14px;padding:10px 14px;font-weight:700;margin:10px 0;font-size:15px}
.link{background:none;border:none;color:var(--lav-d);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:8px 0;font-size:15px}
.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.payadd{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.payadd .btn-sm{font-size:13px;min-height:38px;padding:4px 12px}
.x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.grid3 label{font-size:12px;font-weight:700;color:var(--muted)}
.grid3 select{width:100%;font:inherit;font-size:14px;padding:8px;border:2px solid var(--line);border-radius:12px;background:#fff}
.check2{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:6px 0 12px}
.check2 input{width:22px;height:22px;flex:none;accent-color:var(--pink)}
.busy{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--night);color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;z-index:30}
.busy[hidden]{display:none}
.cta{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:96px;margin:0 0 16px;line-height:1.15}
.cta small{font-size:12px;font-weight:600;opacity:.9}
.cta-ic{font-size:26px}
.cta.locked{background:#ECE6F8;color:var(--muted);box-shadow:none;cursor:default}
</style>

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const fd=s=>pd(s).toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'});
const fdt=t=>new Date(t).toLocaleString('en-IE',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const eur=n=>'€'+Number(n).toLocaleString('en-IE');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>sod(new Date());
const ttl=(en,ko)=>`<h2 class="ttl"><span class="ko" lang="ko">${ko}</span><span class="en">${en}</span></h2>`;
const nextSaturday=()=>{const d=today();d.setDate(d.getDate()+((6-d.getDay()+7)%7));return ymd(d)};
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};

/* ---------- state */
let S={session:null,me:null,settings:{},weeks:[],profiles:[],payments:[],privates:[],attendance:[],plans:[],guests:[],auth:'login',err:'',ok:'',loaded:false};
let ui={tab:null,week:null,group:'beg2',filter:'all'};
const isT=()=>S.me&&S.me.role==='teacher';
const prof=id=>S.profiles.find(p=>p.id===id)||{full_name:'(removed)',email:''};
const nm=p=>p.full_name||p.email||'Student';
const students=()=>S.profiles.filter(p=>p.role==='student');

async function q(p){const {data,error}=await p;if(error)throw error;return data}

async function loadAll(){
  const uid=S.session.user.id;
  const [me,settings,weeks,links]=await Promise.all([
    q(sb.from('profiles').select('*').eq('id',uid).single()),
    q(sb.from('settings').select('*').eq('id',1).single()),
    q(sb.from('weeks').select('*').order('date')),
    q(sb.from('class_links').select('*').eq('id',1))]);
  Object.assign(S,{me,settings,weeks,links:links[0]||null});
  if(me.role==='teacher'){
    const [profiles,payments,privates,attendance,plans,guests]=await Promise.all([
      q(sb.from('profiles').select('*').order('full_name')),
      q(sb.from('payments').select('*').order('created_at')),
      q(sb.from('private_lessons').select('*').order('starts_at')),
      q(sb.from('attendance').select('*')),
      q(sb.from('lesson_plans').select('*')),
      q(sb.from('game_day_guests').select('*').order('created_at'))]);
    Object.assign(S,{profiles,payments,privates,attendance,plans,guests});
  }else{
    const [payments,privates]=await Promise.all([
      q(sb.from('payments').select('*').eq('student_id',uid).order('created_at')),
      q(sb.from('private_lessons').select('*').eq('student_id',uid).order('starts_at'))]);
    Object.assign(S,{profiles:[me],payments,privates,attendance:[],plans:[],guests:[]});
  }
  S.loaded=true;
}

/* ---------- term logic: a term = consecutive Saturdays; 10 classes; class 10 = Game Day */
function terms(){const out=[];let cur=[];for(const w of S.weeks){if(cur.length&&pd(w.date)-pd(cur[cur.length-1].date)>8*DAY){out.push(cur);cur=[]}cur.push(w)}if(cur.length)out.push(cur);return out}
function term(){const t=today(),ts=terms();return ts.find(x=>pd(x[x.length-1].date)>=t)||ts[ts.length-1]||[]}
function numbered(tw){let n=0;return tw.map(w=>w.type==='break'?{...w,no:null,kind:'break'}:(n++,{...w,no:n,kind:n===10?'game':'class'}))}
const termOver=tw=>!tw.length||pd(tw[tw.length-1].date)<today();
const breakStart=tw=>addDays(tw[tw.length-1].date,7);
const nextTerm=tw=>addDays(tw[tw.length-1].date,7*((S.settings.break_weeks||2)+1));
const weekBadge=w=>w.kind==='break'?'<span class="badge b-break">Break</span>':w.kind==='game'?'<span class="badge b-game">🎲 Game Day</span>':w.mode==='online'?'<span class="badge b-on">Online</span>':'<span class="badge b-off">In person</span>';
const weekLabel=w=>w.kind==='break'?'Break week':w.kind==='game'?'Class '+w.no+' · Korean Game Day':'Class '+w.no;
const isLate=p=>p.status==='due'&&p.due_date&&pd(p.due_date)<today();
const payBadge=p=>p.status==='paid'?'<span class="badge b-paid">Paid</span>':isLate(p)?'<span class="badge b-late">Overdue</span>':'<span class="badge b-due">Due'+(p.due_date?' '+fd(p.due_date):'')+'</span>';
const owes=id=>S.payments.some(p=>p.student_id===id&&p.status==='due');
function packInfo(p){
  if(!p.pack_size) return null;
  const mine=S.privates.filter(x=>x.student_id===p.id);
  const done=mine.filter(x=>x.status==='done').length, booked=mine.filter(x=>x.status==='booked'||x.status==='resched').length;
  return {size:p.pack_size,done,booked,left:Math.max(0,p.pack_size-done-booked)};
}

const busy=b=>document.getElementById('busy').hidden=!b;

    h+=`<div class="card"><div class="row"><h3>${G.name}${!me.group_code?' (trial)':''}</h3><span class="muted small">Saturdays ${G.time}</span></div>
      ${next?`<p style="margin:6px 0 2px" class="muted small">Next class</p><div class="row"><b style="font-size:20px">${fd(next.date)}</b>${weekBadge(next)}</div>

        <li><span>${fd(breakStart(tw))}<br><span class="small muted">Break: ${S.settings.break_weeks} ${S.settings.break_weeks===1?'week':'weeks'}</span></span><span class="badge b-break">Break</span></li>
        <li><span>${fd(nextTerm(tw))}<br><span class="small muted">Next term starts</span></span><span class="badge b-on">New term</span></li></ul></div>`;
    }
  }
  const pi=packInfo(me);
  if(pi){
    const mine=S.privates.filter(p=>p.status==='booked'||p.status==='resched').sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));

  if(ui.group==='private') return h+vTeacherPrivate();
  if(termOver(raw)) return h+vStartTerm(raw);
  if(ui.week==null||ui.week>=tw.length){const i=tw.findIndex(w=>w.kind!=='break'&&pd(w.date)>=today());ui.week=i<0?tw.length-1:i}
  const i=ui.week, w=tw[i], g=GROUPS[ui.group];
  h+=`<div class="weeknav"><button data-act="week" data-d="-1" ${i<=0?'disabled':''} aria-label="Previous week">◀</button><div class="mid"><strong>${fd(w.date)}</strong><span class="small muted">${weekLabel(w)} · ${g.time}</span></div><button data-act="week" data-d="1" ${i>=tw.length-1?'disabled':''} aria-label="Next week">▶</button></div>
  <div class="card"><div class="seg">
    <button class="btn btn-sm ${w.kind!=='break'&&w.mode==='offline'?'btn-main':'btn-ghost'}" data-act="mode" data-m="offline">In person</button>

  if(w.kind==='break') return h+`<div class="card"><p style="margin:0">Break week (e.g. bank holiday): no class. The term moved one week later so it still has 10 classes.</p></div>`;

        <span class="small">€10 upfront: ${x.deposit_status==='paid'?'✅':'⏳'} · €15 on the day: ${x.on_day_status==='paid'?'✅':'⏳'}</span></span>
        <span style="display:flex;flex-direction:column;gap:6px"><button class="btn btn-sm ${x.deposit_status==='paid'?'btn-ghost':'btn-main'}" data-act="gpay" data-id="${x.id}" data-part="deposit_status">${x.deposit_status==='paid'?'Undo €10':'€10 paid'}</button>
        <button class="btn btn-sm ${x.on_day_status==='paid'?'btn-ghost':'btn-main'}" data-act="gpay" data-id="${x.id}" data-part="on_day_status">${x.on_day_status==='paid'?'Undo €15':'€15 paid'}</button></span></li>`).join('')||'<li class="muted">No guests yet.</li>'}</ul>
      <div class="field" style="margin-top:10px"><label for="gName">Add a guest</label><input class="inp" id="gName" type="text" placeholder="Name"></div>

      <p class="small muted" style="margin:8px 0 0">Next term starts ${fd(nextTerm(raw))}.</p></div>

  h+=`<div class="card"><div class="row"><h3>Attendance</h3><b>${list.filter(s=>att.has(s.id)).length}/${list.length}</b></div>

  return h;
}
function vTeacherPrivate(){
  const up=S.privates.filter(p=>p.status==='booked'||p.status==='resched').sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
  return `<div class="card"><h3>Upcoming private lessons</h3><ul class="list">${up.map(p=>`<li><span><b>${esc(nm(prof(p.student_id)))}</b><br><span class="small muted">${fdt(p.starts_at)}</span>${p.status==='resched'?'<br><span class="badge b-due">Asked to reschedule</span>':''}</span>
    <span style="display:flex;flex-direction:column;gap:6px"><button class="btn btn-main btn-sm" data-act="pstatus" data-s="done" data-id="${p.id}">Done</button><button class="btn btn-ghost btn-sm" data-act="pstatus" data-s="cancelled" data-id="${p.id}">Cancel</button></span></li>`).join('')||'<li class="muted">None booked</li>'}</ul></div>
  <div class="card"><h3>Book a private lesson</h3>
    <div class="field"><label for="pStu">Student</label><select class="inp" id="pStu">${students().map(s=>`<option value="${s.id}">${esc(nm(s))}</option>`).join('')}</select></div>
    <div class="field"><label for="pWhen">Date and time</label><input class="inp" id="pWhen" type="datetime-local"></div>
    <button class="btn btn-ghost" data-act="addpriv">Add lesson</button></div>
  <div class="card"><h3>Packs</h3><ul class="list">${students().filter(s=>s.pack_size).map(s=>{const pi=packInfo(s);return `<li><span>${esc(nm(s))}</span><span class="small">${pi.done}/${pi.size} done · ${pi.booked} booked · <b>${pi.left} left</b></span></li>`}).join('')||'<li class="muted">No packs yet. Set one in Students.</li>'}</ul></div>`;
}
function vTeacherStudents(){
  const F={all:()=>true,owes:s=>owes(s.id),beg2:s=>s.group_code==='beg2',imp:s=>s.group_code==='imp',private:s=>!!s.pack_size,none:s=>!s.group_code&&!s.trial_group&&!s.pack_size};
  const list=students().filter(F[ui.filter]);
  const opt=(v,cur,l)=>`<option value="${v}" ${String(cur??'')===String(v)?'selected':''}>${l}</option>`;
  return `${ttl('Students','학생')}<div class="chips">${[['all','All'],['none','New / no class'],['owes','Owe money'],['beg2','Beginner Lv2'],['imp','Improver'],['private','Private']].map(([k,l])=>`<button class="chip ${ui.filter===k?'on':''}" data-act="filter" data-f="${k}">${l}</button>`).join('')}</div>
  ${list.map(s=>`<div class="card"><div class="row"><div><b style="font-size:18px">${esc(nm(s))}</b><br><span class="small muted">${esc(s.email)} · Ref ${esc(s.ref)}</span></div><span title="Instagram photo consent" class="badge ${s.photo_consent?'b-paid':'b-off'}">📸 ${s.photo_consent?'Yes':'No'}</span></div>
    <div class="grid3">
      <div><label>Group</label><select data-change="prof" data-id="${s.id}" data-f="group_code">${opt('',s.group_code,'None')}${opt('beg2',s.group_code,'Beginner Lv2')}${opt('imp',s.group_code,'Improver')}</select></div>
      <div><label>Trial</label><select data-change="prof" data-id="${s.id}" data-f="trial_group">${opt('',s.trial_group,'None')}${opt('beg2',s.trial_group,'Beginner Lv2')}${opt('imp',s.trial_group,'Improver')}</select></div>
      <div><label>Private pack</label><select data-change="prof" data-id="${s.id}" data-f="pack_size">${opt('',s.pack_size,'None')}${opt('5',s.pack_size,'5 lessons')}${opt('10',s.pack_size,'10 lessons')}</select></div>
    </div>
    <ul class="list" style="margin-top:8px">${S.payments.filter(p=>p.student_id===s.id).map(p=>`<li><span class="small">${esc(p.description)}<br><b>${eur(p.amount)}</b> ${payBadge(p)}</span><span style="display:flex;align-items:center"><button class="btn btn-sm ${p.status==='paid'?'btn-ghost':'btn-main'}" data-act="paid" data-id="${p.id}" data-st="${p.status}">${p.status==='paid'?'Undo':'Mark paid'}</button><button class="x" data-act="delpay" data-id="${p.id}" aria-label="Delete payment">×</button></span></li>`).join('')}</ul>
    <div class="payadd"><span class="small muted" style="width:100%">Add a payment to ask for:</span>${Object.entries(PAYKINDS).map(([k,[l,a]])=>`<button class="btn btn-ghost btn-sm" data-act="addpay" data-id="${s.id}" data-k="${k}">${l.split(' (')[0].replace('Private pack – ','Pack ')} ${eur(a)}</button>`).join('')}</div>
  </div>`).join('')||'<p class="muted">No students here yet. When students create an account, they appear here.</p>'}`;
}
function vTeacherMoney(){
  const all=S.payments.map(p=>({...p,who:nm(prof(p.student_id)),ref:prof(p.student_id).ref,amount:Number(p.amount)}))
    .concat(S.guests.flatMap(g=>[{description:'Game Day: €10 upfront',amount:10,status:g.deposit_status,who:g.name,ref:g.ref,guest:1},{description:'Game Day: €15 in person',amount:15,status:g.on_day_status,who:g.name,ref:g.ref,guest:1}]));
  const sum=f=>all.filter(f).reduce((a,p)=>a+p.amount,0);
  const paid=sum(p=>p.status==='paid'), due=sum(p=>p.status==='due'), late=all.filter(p=>!p.guest&&isLate(p));
  const type=p=>p.guest?'Game Day guests':p.description.startsWith('Group')?'Group lessons':p.description.startsWith('Private')?'Private lessons':'Trial classes';
  const by={}; all.filter(p=>p.status==='paid').forEach(p=>by[type(p)]=(by[type(p)]||0)+p.amount);
  const st=S.settings;
  return `${ttl('Money','수입')}
  <div class="grid2"><div class="card tile green"><div class="lbl">Received</div><div class="big">${eur(paid)}</div></div>
  <div class="card tile ${due?'red':''}"><div class="lbl">Still owed</div><div class="big">${eur(due)}</div><div class="small muted">${late.length} overdue</div></div></div>
  <div class="card"><h3>Received by type</h3><ul class="list">${Object.entries(by).map(([k,v])=>`<li><span>${k}</span><b>${eur(v)}</b></li>`).join('')||'<li class="muted">Nothing yet.</li>'}</ul></div>
  <div class="card"><h3>Who owes</h3><ul class="list">${all.filter(p=>p.status==='due').map(p=>`<li><span><b>${esc(p.who)}</b> · ${esc(p.ref)}<br><span class="small muted">${esc(p.description)} · ${eur(p.amount)}</span></span>${p.guest?'<span class="badge b-due">Game Day</span>':payBadge(p)}</li>`).join('')||'<li class="muted">Nobody, all paid!</li>'}</ul></div>
  <div class="card"><h3>🏦 Bank details & links shown to students</h3>
    <div class="field"><label for="bName">Account name</label><input class="inp" id="bName" type="text" value="${esc(st.account_name)}"></div>
    <div class="field"><label for="bIban">IBAN</label><input class="inp" id="bIban" type="text" value="${esc(st.iban)}"></div>
    <div class="field"><label for="bBic">BIC</label><input class="inp" id="bBic" type="text" value="${esc(st.bic)}"></div>
    <div class="field"><label for="bRev">Google review link</label><input class="inp" id="bRev" type="text" value="${esc(st.review_url)}"></div>
    <div class="field"><label for="hClass">📚 Homework (materials): Google Classroom link</label><input class="inp" id="hClass" type="url" placeholder="https://classroom.google.com/…" value="${esc((S.links||{}).classroom_url||'')}"></div>
    <div class="field"><label for="hTeams">💻 Online class: Teams link</label><input class="inp" id="hTeams" type="url" placeholder="https://teams.microsoft.com/…" value="${esc((S.links||{}).teams_url||'')}"></div>
    <p class="small muted" style="margin:0 0 6px">These two buttons only appear for students who have paid (at least one payment marked paid, nothing overdue).</p>
    <button class="btn btn-main" data-act="savebank">Save details</button>
    <p class="small muted" style="margin:8px 0 0">Only logged-in students can see these.</p></div>`;
}

/* ---------- SHELL */
function render(){
  const root=document.getElementById('root');
  if(!S.session||S.auth==='newpass'){root.innerHTML=vAuth();return}
  if(!S.loaded){root.innerHTML=header('Loading…')+(S.err?`<main><div class="err">${esc(S.err)}</div></main>`:'<main><p>Loading your classes…</p></main>');return}
  const T=isT();
  const tabs=T?[['classes','📚','Classes','수업'],['students','👥','Students','학생'],['money','€','Money','수입']]:[['home','🏠','My classes','내 수업'],['pay','€','Payments','결제'],['info','ℹ️','Info','정보']];
  if(!tabs.some(t=>t[0]===ui.tab)) ui.tab=tabs[0][0];
  const newCount=T?students().filter(s=>!s.group_code&&!s.trial_group&&!s.pack_size).length:0;
  const body=T?(ui.tab==='classes'?vTeacherClasses():ui.tab==='students'?vTeacherStudents():vTeacherMoney()):(ui.tab==='home'?vStudentHome():ui.tab==='pay'?vStudentPay():vStudentInfo());
  root.innerHTML=header(T?'Teacher view':esc(nm(S.me)))+`<main>${body}</main>
  <nav class="tabs">${tabs.map(([k,ic,l,ko])=>`<button class="${ui.tab===k?'on':''}" data-act="tab" data-tab="${k}"><span class="ic">${ic}</span><span class="tl">${l}</span><span class="tk" lang="ko">${ko}</span>${T&&k==='students'&&newCount?`<span class="dot">${newCount}</span>`:''}${!T&&k==='pay'&&S.payments.some(p=>p.status==='due')?'<span class="dot">!</span>':''}</button>`).join('')}</nav>`;
}

/* ---------- AUTH flow */
async function boot(session){
  S.session=session; S.err=''; S.loaded=false;
  if(!session){render();return}
  render();
  try{await loadAll()}catch(e){console.error(e);S.err='Could not load your account: '+(e.message||e)}
  render();
}
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){S.auth='newpass';S.session=session;S.err='';S.ok='';render();return}
  if(event==='TOKEN_REFRESHED'){S.session=session;return}
  setTimeout(()=>boot(session),0);
});

document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const kind=f.dataset.form; S.err='';S.ok='';busy(true);
  try{
    if(kind==='login'){const {error}=await sb.auth.signInWithPassword({email:val('em'),password:document.getElementById('pw').value});if(error)throw error}
    if(kind==='signup'){
      const {data,error}=await sb.auth.signUp({email:val('em'),password:document.getElementById('pw').value,options:{data:{full_name:val('fn')},emailRedirectTo:APP_URL}});
      if(error)throw error;
      if(!data.session){S.auth='login';S.ok='Account created! Check your inbox (and spam) for a confirmation email, then log in.'}
    }
    if(kind==='forgot'){const {error}=await sb.auth.resetPasswordForEmail(val('em'),{redirectTo:APP_URL});if(error)throw error;S.ok='If this email has an account, a reset link is on its way.'}
    if(kind==='newpass'){const {error}=await sb.auth.updateUser({password:document.getElementById('pw').value});if(error)throw error;S.auth='login';S.ok='Password saved.';boot((await sb.auth.getSession()).data.session)}
  }catch(err){S.err=err.message||String(err)}
  finally{busy(false)}
  render();
});

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act, d=el.dataset;
  if(a==='home'){e.preventDefault();ui.tab=null;ui.week=null;ui.group='beg2';ui.filter='all';if(!S.session){S.auth='login';S.err='';S.ok=''}window.scrollTo(0,0);render();return}
  if(a==='auth'){S.auth=d.v;S.err='';S.ok='';render();return}
  if(a==='logout'){sb.auth.signOut();S.me=null;ui={tab:null,week:null,group:'beg2',filter:'all'};return}
  if(a==='tab'){ui.tab=d.tab;window.scrollTo(0,0);render();return}
  if(a==='group'){ui.group=d.g;render();return}
  if(a==='filter'){ui.filter=d.f;render();return}
  if(a==='week'){ui.week=Math.max(0,ui.week+Number(d.d));render();return}
  const tw=term(), w=numbered(tw)[ui.week];
  if(a==='mode') return run(async()=>{
    const m=d.m, last=tw[tw.length-1];
    if(m==='break'){if(w.type==='break')return;
      await q(sb.from('weeks').update({type:'break'}).eq('id',w.id));
      await q(sb.from('weeks').insert({date:addDays(last.date,7),type:'class',mode:'offline'}));
    }else if(w.type==='break'){
      await q(sb.from('weeks').update({type:'class',mode:m}).eq('id',w.id));
      const cls=tw.filter(x=>x.type!=='break');
      if(cls.length>=10) await q(sb.from('weeks').delete().eq('id',cls[cls.length-1].id));
    }else await q(sb.from('weeks').update({mode:m}).eq('id',w.id));
  },'Schedule updated');
  if(a==='att') return run(async()=>{
    const has=S.attendance.some(x=>x.week_id===Number(d.w)&&x.student_id===d.id);
    if(has) await q(sb.from('attendance').delete().eq('week_id',d.w).eq('student_id',d.id));
    else await q(sb.from('attendance').insert({week_id:Number(d.w),student_id:d.id,present:true}));
  });
  if(a==='startterm') return run(async()=>{
    const s=val('termStart'); if(!s) throw new Error('Pick a date first');
    if(pd(s).getDay()!==6&&!confirm('That date is not a Saturday. Use it anyway?')) return;
    await q(sb.from('weeks').insert([...Array(10)].map((_,i)=>({date:addDays(s,7*i),type:'class',mode:'offline'}))));
    ui.week=null;
  },'Term created: 10 classes');
  if(a==='brk') return run(()=>q(sb.from('settings').update({break_weeks:Number(d.n),updated_at:new Date().toISOString()}).eq('id',1)),'Break updated');
  if(a==='addguest') return run(async()=>{const n=val('gName');if(!n)throw new Error('Type the guest name first');await q(sb.from('game_day_guests').insert({week_id:Number(d.w),name:n,contact:val('gContact')||null}))},'Guest added');
  if(a==='gpay') return run(async()=>{const g=S.guests.find(x=>x.id===d.id);await q(sb.from('game_day_guests').update({[d.part]:g[d.part]==='paid'?'due':'paid'}).eq('id',d.id))});
  if(a==='paid') return run(()=>q(sb.from('payments').update(d.st==='paid'?{status:'due',paid_at:null}:{status:'paid',paid_at:new Date().toISOString()}).eq('id',d.id)),d.st==='paid'?'Marked as not paid':'Marked as paid');
  if(a==='delpay'){if(!confirm('Delete this payment?'))return;return run(()=>q(sb.from('payments').delete().eq('id',d.id)),'Payment deleted')}
  if(a==='addpay') return run(()=>{const [desc,amt]=PAYKINDS[d.k];return q(sb.from('payments').insert({student_id:d.id,description:desc,amount:amt,status:'due',due_date:addDays(ymd(today()),7)}))},'Payment added');
  if(a==='addpriv') return run(async()=>{const s=val('pStu'),t=val('pWhen');if(!s||!t)throw new Error('Choose a student and a date/time');await q(sb.from('private_lessons').insert({student_id:s,starts_at:new Date(t).toISOString()}))},'Lesson booked');
  if(a==='pstatus') return run(()=>q(sb.from('private_lessons').update({status:d.s}).eq('id',d.id)),d.s==='done'?'Lesson marked done':'Lesson cancelled');
  if(a==='resched') return run(()=>q(sb.rpc('request_reschedule',{lesson_id:d.id})),'Reschedule request sent to your teacher');
  if(a==='savebank') return run(async()=>{
    await q(sb.from('settings').update({account_name:val('bName'),iban:val('bIban'),bic:val('bBic'),review_url:val('bRev'),updated_at:new Date().toISOString()}).eq('id',1));
    await q(sb.from('class_links').update({classroom_url:val('hClass'),teams_url:val('hTeams')}).eq('id',1));
  },'Details saved');
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.change==='consent') return run(()=>q(sb.from('profiles').update({photo_consent:el.checked}).eq('id',S.me.id)),el.checked?'Photo consent saved':'Photo consent removed');
  if(el.dataset.change==='prof'){const v=el.value===''?null:(el.dataset.f==='pack_size'?Number(el.value):el.value);return run(()=>q(sb.from('profiles').update({[el.dataset.f]:v}).eq('id',el.dataset.id)),'Student updated')}
});
let planT;
document.addEventListener('input',e=>{
  const el=e.target; if(!el.dataset.plan) return;
  clearTimeout(planT);
  planT=setTimeout(async()=>{
    const row={week_id:Number(el.dataset.plan),group_code:el.dataset.g,plan:el.value,updated_at:new Date().toISOString()};
    const {error}=await sb.from('lesson_plans').upsert(row,{onConflict:'week_id,group_code'});
    if(error)toast('⚠️ '+error.message);else{const i=S.plans.findIndex(p=>p.week_id===row.week_id&&p.group_code===row.group_code);if(i<0)S.plans.push(row);else S.plans[i]=row}
  },800);
});
</script>
